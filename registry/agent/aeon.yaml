sovereignty_notes: |
  Aeon Inc. (British Virgin Islands). Fully self-hostable: you fork the repo and run it in your own GitHub Actions, with no proprietary backend or telemetry. Model-agnostic 4: the run path is provider-abstracted through a six-harness adapter and can target an OpenRouter/gateway backend, but the shipped fleet defaults to a specific Claude tier, so it favours one provider out of the box rather than being fully tier-neutral.
