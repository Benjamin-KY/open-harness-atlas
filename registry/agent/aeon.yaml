tagline: Self-hostable autonomous agent framework that runs Markdown-defined skills on a schedule in GitHub Actions, dispatching each run through a pluggable adapter across six model harnesses.
description: |
  Aeon is an autonomous agent framework that runs unattended on GitHub Actions. Behaviour is defined as Markdown "skills" with least-privilege secret contracts; a scheduler dispatches them on cron, and every surface (scheduler, inbound messages, MCP server) routes through a single harness-adapter (run-harness) that abstracts the model tier across six harnesses: Claude Code, Grok, Codex, an OpenRouter/gateway path, and two further CLI backends. State is git-committed Markdown plus an optional GitHub-Issue ledger, so a fork carries its own durable memory with no external database.

  In the atlas: Aeon is an agent-orchestration entry. The harness paradigm reads agent frameworks as the policy and tool-routing layer between intent and the model tier; Aeon's distinguishing trait is that this layer is itself a pluggable multi-harness dispatcher rather than being bound to one provider CLI. It complements provider gateways (it can front an OpenRouter/gateway backend) and unattended Claude Code loops. It is not a model, an eval harness, or a hosted service. There is no SaaS; you self-host by forking the repository.
